<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">Languages</a>
      <nav class="site-nav">
        <a href="index.html">Today</a>
        <a href="drill.html">Drill</a>
        <a href="vocab.html">Vocab</a>

  <main id="main">
    <h1 id="heading">Conjugate</h1>
    <section id="stage" class="card" hidden>
      <p class="muted small" id="counter"></p>
      <p class="muted" id="cellLine"></p>
      <p class="drill-prompt"><span id="verb" lang="es"></span> <span class="muted small" id="verbEn"></span></p>
      <div id="typeZone">
        <textarea id="typed" rows="1" lang="es" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Type the form"></textarea>
        <button class="primary big" id="check">Check</button>
      </div>
      <p id="feedback" class="diff-out" lang="es" hidden></p>
      <p id="nextRow" hidden><button class="primary big" id="next">Next</button></p>
    </section>
    <section id="done" class="card" hidden>
      <h2>Session complete</h2>
      <p id="summary"></p>
      <ul id="missList"></ul>
      <div class="action-row">
        <a href="index.html"><button>Back to Today</button></a>
        <a href="conj.html"><button class="primary">Another round</button></a>
      </div>
    </section>
    <p id="status" class="muted">Loading...</p>
    <p class="muted small">Conjugations from the Fred Jehle Spanish verb database (CC BY-NC-SA). Accents count: <span lang="es">hablo</span> and <span lang="es">habló</span> are different words in different tenses.</p>
