<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow - Languages</title>
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232456a4'/%3E%3Ctext x='32' y='46' font-family='system-ui,sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">Languages</a>
      <nav class="site-nav">
        <a href="index.html">Today</a>
        <a href="drill.html">Drill</a>
        <a href="shadow.html">Shadow</a>
        <a href="method.html">Method</a>
        <a href="progress.html">Progress</a>
        <a href="station.html">Station</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <h1 id="heading">Shadow</h1>
    <section id="stage" class="card" hidden>
      <p class="muted small" id="counter"></p>
      <p id="target" lang="es" class="shadow-target"></p>
      <p id="english" class="muted"></p>
      <div class="transport">
        <button id="prev">Prev</button>
        <button class="primary" id="playBtn">Play</button>
        <button id="next">Next</button>
      </div>
      <div class="shadow-options">
        <button id="loop" aria-pressed="false">Loop</button>
        <button id="chain" aria-pressed="false">Auto-advance</button>
        <select id="rate" aria-label="Playback rate">
          <option value="1">1.0x</option>
          <option value="0.85">0.85x</option>
          <option value="0.75">0.75x</option>
        </select>
        <button id="toggleEn" aria-pressed="true">English</button>
      </div>
      <p class="muted small" style="margin-bottom:0">Say it simultaneously with the voice, not after it. Space plays, arrows move.</p>
    </section>
    <p id="status" class="muted">Loading...</p>
  </main>
  <audio id="player" preload="none"></audio>
  <script type="module" src="js/shadow.js"></script>
</body>
</html>
